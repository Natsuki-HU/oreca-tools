<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="ORECA Tools" />
  <title>ORECA Tools</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/icon-180.png" />
  <link rel="stylesheet" href="./assets/common.css" />
</head>
<body>
  <div class="app-shell">
    <header class="site-header">
      <div>
        <div class="eyebrow">ORECA TOOLS</div>
        <h1>オレカ ツール集</h1>
        <p>必要な機能を順次追加していく統合ツールです。</p>
      </div>
    </header>

    <main class="launcher-grid">
      <a class="tool-card active" href="./damage/">
        <span class="tool-category">戦闘</span>
        <strong>ダメージ計算</strong>
        <span>最低・最高ダメージを計算</span>
      </a>

      <div class="tool-card disabled" aria-disabled="true">
        <span class="tool-category">準備中</span>
        <strong>今後のツール</strong>
        <span>GM・コマンド・RAND・検索系などを順次統合予定</span>
      </div>
    </main>

    <footer class="site-footer">Version <span data-app-version></span></footer>
  </div>

  <script type="module" src="./assets/pwa.js"></script>
  <script type="module">
    import { APP_VERSION } from './assets/version.js';
    for (const el of document.querySelectorAll('[data-app-version]')) el.textContent = APP_VERSION;
  </script>
</body>
</html>
